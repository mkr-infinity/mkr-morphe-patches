# Scheduled and on-demand workflow to check official Morphe upstream releases.
# Opens a reviewable Pull Request when updates are found. Never builds APKs automatically.

name: Check Upstream Morphe Updates

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-upstream
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    name: Monitor Official Morphe Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Upstream Update Detector
        id: detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_upstream_patches.py

      - name: Validate Catalog After Sync
        if: steps.detector.outputs.update_detected == 'true'
        run: python3 scripts/validate_catalog.py

      - name: Create or Update Pull Request
        if: steps.detector.outputs.update_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.detector.outputs.branch_name }}
          PR_TITLE: ${{ steps.detector.outputs.pr_title }}
          PR_BODY_FILE: ${{ steps.detector.outputs.pr_body_file }}
        run: |
          # Configure git identity for automated PR branch creation
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request already exists (#$EXISTING_PR) for $BRANCH_NAME. Skipping creation."
            exit 0
          fi

          # Create or reset branch and commit config changes safely
          git checkout -B "$BRANCH_NAME"
          git add config/upstream.json config/apps.json
          if ! git diff --staged --quiet; then
            git commit -m "$PR_TITLE [skip ci]"
            git push origin "$BRANCH_NAME" --force
          else
            echo "No staged config changes detected. Skipping commit and push."
          fi


          # Open reviewable pull request
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE" \
            || echo "::warning::PR creation failed or already exists."
