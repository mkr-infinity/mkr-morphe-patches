# Automatic and on-demand APK build workflow for MKR Morphe Patches.
# Executes daily incremental update checks (06:00 UTC) and manual workflow_dispatch builds,
# applying Morphe patches in parallel and publishing verified APKs with manifests to GitHub Releases.

name: Build Patched APKs

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "⚡ Force full rebuild (rebuild all eligible apps, bypass incremental check)"
        type: boolean
        default: false

      select_all:
        description: "⚡ Select all eligible applications"
        type: boolean
        default: false

      youtube:
        description: "Build YouTube"
        type: boolean
        default: false

      youtube_music:
        description: "Build YouTube Music"
        type: boolean
        default: false

      reddit:
        description: "Build Reddit"
        type: boolean
        default: false

      smart_launcher:
        description: "Build Smart Launcher"
        type: boolean
        default: false

      moviebox:
        description: "Build MovieBox Pro Mobile"
        type: boolean
        default: false

      instagram:
        description: "Build Instagram"
        type: boolean
        default: false

      telegram:
        description: "Build Telegram"
        type: boolean
        default: false

      facebook:
        description: "Build Facebook"
        type: boolean
        default: false

      twitter:
        description: "Build Twitter / X"
        type: boolean
        default: false

      tiktok:
        description: "Build TikTok"
        type: boolean
        default: false

      twitch:
        description: "Build Twitch"
        type: boolean
        default: false

      duolingo:
        description: "Build Duolingo"
        type: boolean
        default: false

      messenger:
        description: "Build Messenger"
        type: boolean
        default: false

      discord:
        description: "Build Discord"
        type: boolean
        default: false

      enable_side_by_side:
        description: "Enable side-by-side clone (install alongside original app)"
        type: boolean
        default: true

      custom_clone_pkg:
        description: "Optional custom package name for side-by-side clone (leave empty for default .morphe)"
        type: string
        default: ""

      experimental_mode:
        description: "Experimental mode (allow unverified versions with --force)"
        type: boolean
        default: false

      publish_release:
        description: "🚀 Create GitHub Release and upload all patched APKs"
        type: boolean
        default: true

      apk_source_url:
        description: "Optional direct download URL for input APK (if not provided via artifact)"
        type: string
        default: ""

      extra_patch_options:
        description: "Optional extra Morphe patch flags or options (e.g. -O amoled=true)"
        type: string
        default: ""

      retain_diagnostics:
        description: "Retain debug logs and patching diagnostics in artifacts"
        type: boolean
        default: true

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan-builds:
    name: Plan Incremental Builds
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.planner.outputs.has_updates }}
      build_matrix: ${{ steps.planner.outputs.build_matrix }}
      update_count: ${{ steps.planner.outputs.update_count }}
      skip_count: ${{ steps.planner.outputs.skip_count }}
      total_count: ${{ steps.planner.outputs.total_count }}
      patch_revision: ${{ steps.planner.outputs.patch_revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate Incremental Build Plan
        id: planner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.force_full_rebuild || 'false' }}
          SELECT_ALL: ${{ inputs.select_all || 'false' }}
          IN_YOUTUBE: ${{ inputs.youtube || 'false' }}
          IN_YOUTUBE_MUSIC: ${{ inputs.youtube_music || 'false' }}
          IN_REDDIT: ${{ inputs.reddit || 'false' }}
          IN_SMART_LAUNCHER: ${{ inputs.smart_launcher || 'false' }}
          IN_MOVIEBOX: ${{ inputs.moviebox || 'false' }}
          IN_INSTAGRAM: ${{ inputs.instagram || 'false' }}
          IN_TELEGRAM: ${{ inputs.telegram || 'false' }}
          IN_FACEBOOK: ${{ inputs.facebook || 'false' }}
          IN_TWITTER: ${{ inputs.twitter || 'false' }}
          IN_TIKTOK: ${{ inputs.tiktok || 'false' }}
          IN_TWITCH: ${{ inputs.twitch || 'false' }}
          IN_DUOLINGO: ${{ inputs.duolingo || 'false' }}
          IN_MESSENGER: ${{ inputs.messenger || 'false' }}
          IN_DISCORD: ${{ inputs.discord || 'false' }}
        run: |
          # Determine selected apps from manual dispatch inputs
          SELECTED_ARG="all"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SELECT_ALL" != "true" ]; then
            SELECTED=()
            [ "$IN_YOUTUBE" = "true" ] && SELECTED+=("youtube")
            [ "$IN_YOUTUBE_MUSIC" = "true" ] && SELECTED+=("youtube_music")
            [ "$IN_REDDIT" = "true" ] && SELECTED+=("reddit")
            [ "$IN_SMART_LAUNCHER" = "true" ] && SELECTED+=("smart_launcher")
            [ "$IN_MOVIEBOX" = "true" ] && SELECTED+=("moviebox")
            [ "$IN_INSTAGRAM" = "true" ] && SELECTED+=("instagram")
            [ "$IN_TELEGRAM" = "true" ] && SELECTED+=("telegram")
            [ "$IN_FACEBOOK" = "true" ] && SELECTED+=("facebook")
            [ "$IN_TWITTER" = "true" ] && SELECTED+=("twitter")
            [ "$IN_TIKTOK" = "true" ] && SELECTED+=("tiktok")
            [ "$IN_TWITCH" = "true" ] && SELECTED+=("twitch")
            [ "$IN_DUOLINGO" = "true" ] && SELECTED+=("duolingo")
            [ "$IN_MESSENGER" = "true" ] && SELECTED+=("messenger")
            [ "$IN_DISCORD" = "true" ] && SELECTED+=("discord")

            if [ ${#SELECTED[@]} -gt 0 ]; then
              IFS=,
              SELECTED_ARG="${SELECTED[*]}"
              unset IFS
            fi
          fi

          FORCE_ARG=""
          if [ "$FORCE_FULL" = "true" ]; then
            FORCE_ARG="--force-full"
          fi

          echo "Running plan_builds.py with selected_apps='$SELECTED_ARG' $FORCE_ARG..."
          python3 scripts/plan_builds.py \
            --selected-apps "$SELECTED_ARG" \
            $FORCE_ARG

      - name: Upload Build Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkr-morphe-build-plan
          path: build/outputs/build_plan.json
          if-no-files-found: ignore

  build-app:
    name: "Patch: ${{ matrix.name }}"
    needs: plan-builds
    if: needs.plan-builds.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-builds.outputs.build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android Build Tools
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using pre-installed Android build-tools from $BUILD_TOOLS_DIR"
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          else
            echo "ANDROID_HOME build-tools not found, attempting apt fallback..."
            sudo apt-get update -y
            sudo apt-get install -y aapt apksigner zipalign || true
          fi

      - name: Cache Morphe Tooling & Patches
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            tools/
            bundles/
          key: morphe-tools-${{ runner.os }}-${{ needs.plan-builds.outputs.patch_revision }}

      - name: Download Morphe Desktop & Official Patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools bundles input-apks build/outputs

          AUTH_HDR=()
          if [ -n "$GITHUB_TOKEN" ]; then
            AUTH_HDR=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          if [ ! -s "tools/morphe-desktop.jar" ]; then
            echo "[*] Fetching latest Morphe Desktop release..."
            DESKTOP_RELEASE_JSON=$(curl -s "${AUTH_HDR[@]}" "https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest")
            JAR_URL=$(echo "$DESKTOP_RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)
            if [ -n "$JAR_URL" ] && [ "$JAR_URL" != "null" ]; then
              echo "Downloading Morphe Desktop from $JAR_URL..."
              curl -sL "${AUTH_HDR[@]}" "$JAR_URL" -o tools/morphe-desktop.jar
            fi
          fi

          if [ ! -s "bundles/official-patches.mpp" ]; then
            echo "[*] Fetching latest official Morphe Patches bundle..."
            PATCHES_RELEASE_JSON=$(curl -s "${AUTH_HDR[@]}" "https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest")
            MPP_URL=$(echo "$PATCHES_RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url' | head -n 1)
            if [ -n "$MPP_URL" ] && [ "$MPP_URL" != "null" ]; then
              echo "Downloading official Morphe patches from $MPP_URL..."
              curl -sL "${AUTH_HDR[@]}" "$MPP_URL" -o bundles/official-patches.mpp
            fi
          fi

          if [ ! -s "tools/morphe-desktop.jar" ]; then
            echo "::error::Could not download a valid morphe-desktop.jar file."
            exit 1
          fi

          if [ ! -s "bundles/official-patches.mpp" ]; then
            echo "::error::Could not download a valid official-patches.mpp file."
            exit 1
          fi

      - name: Check for User-Uploaded APK Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.id }}
          path: input-apks

      - name: Run Morphe Patching Engine
        id: patcher
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/patch_apk.py \
            --selected-apps "${{ matrix.id }}" \
            --morphe-jar "tools/morphe-desktop.jar" \
            --patches-mpp "bundles/official-patches.mpp" \
            --input-dir "input-apks" \
            --output-dir "build/outputs" \
            --app-version "${{ matrix.version }}" \
            --patch-revision "${{ needs.plan-builds.outputs.patch_revision }}" \
            --apk-url "${{ inputs.apk_source_url }}" \
            --custom-clone-pkg "${{ inputs.custom_clone_pkg }}" \
            --extra-options "${{ inputs.extra_patch_options }}" \
            ${{ (inputs.experimental_mode || false) && '--experimental-mode' || '' }} \
            ${{ (inputs.enable_side_by_side == false) && '' || '--enable-side-by-side' }}

      - name: Upload Patched APK Artifact
        if: hashFiles(format('build/outputs/{0}-patched.apk', matrix.id)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: mkr-morphe-${{ matrix.id }}-patched
          path: build/outputs/${{ matrix.id }}-patched.apk
          if-no-files-found: ignore

      - name: Upload Diagnostics & Manifest
        if: inputs.retain_diagnostics || failure() || hashFiles(format('build/outputs/{0}-build-manifest.json', matrix.id)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: mkr-morphe-${{ matrix.id }}-diagnostics
          path: |
            build/outputs/${{ matrix.id }}-build-manifest.json
            build/outputs/${{ matrix.id }}-result.json
            build/outputs/${{ matrix.id }}-patch.log
          if-no-files-found: ignore

  publish-release:
    name: Publish GitHub Release
    needs: [plan-builds, build-app]
    if: needs.plan-builds.outputs.has_updates == 'true' && (inputs.publish_release != false) && always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all patched APK artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "mkr-morphe-*-patched"
          path: release_apks
          merge-multiple: true

      - name: Download all build diagnostic manifests
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "mkr-morphe-*-diagnostics"
          path: release_manifests
          merge-multiple: true

      - name: Download Previous Release Manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous_state
          gh release download --pattern "manifest.json" --dir previous_state || true

      - name: Consolidate Manifest & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PREV_ARG=""
          if [ -f "previous_state/manifest.json" ]; then
            PREV_ARG="--previous-manifest previous_state/manifest.json"
          fi

          python3 scripts/publish_release.py \
            --manifests-dir "release_manifests" \
            --apks-dir "release_apks" \
            --run-number "$RUN_NUM" \
            --run-id "$RUN_ID" \
            $PREV_ARG

  build-summary:
    name: Build Summary
    needs: [plan-builds, build-app, publish-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Render Overall Build Dashboard
        run: |
          echo "### 🚀 MKR Morphe Patched APK Pipeline Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Evaluation Mode:** Incremental change detection via `manifest.json`" >> $GITHUB_STEP_SUMMARY
          echo "- **Eligible Builds Planned:** ${{ needs.plan-builds.outputs.update_count || 0 }} of ${{ needs.plan-builds.outputs.total_count || 0 }} applications" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Run ID:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Status:** Download individual APKs from the **GitHub Releases** tab or the workflow **Artifacts**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Maintained by @mkr-infinity for [mkr-morphe-patches](https://github.com/mkr-infinity/mkr-morphe-patches)*" >> $GITHUB_STEP_SUMMARY
