# CI Validation Workflow: Checks metadata, YAML integrity, security constraints, and builds patch bundles remotely.

name: Validate Patches & Workflows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-metadata:
    name: Validate Catalog & Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate YAML files syntax
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "
          import yaml, glob, sys

          files = glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True)
          for f in files:
              try:
                  with open(f, 'r') as fp:
                      yaml.safe_load(fp)
                  print(f'[+] Valid YAML: {f}')
              except Exception as e:
                  print(f'[!] Invalid YAML {f}: {e}', file=sys.stderr)
                  sys.exit(1)
          "

      - name: Run Catalog & Security Validator
        run: python3 scripts/validate_catalog.py

      - name: Run Pipeline Logic Tests
        run: python3 tests/test_pipeline_logic.py

  remote-gradle-build:
    name: Remote Patch Compilation
    runs-on: ubuntu-latest
    needs: validate-metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Morphe Patches Compile Remotely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
